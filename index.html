<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="waiting... miss you">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8C%BB</text></svg>">
<title>waiting...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,400&display=swap">
<style>
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  html{color-scheme:dark;}
  [hidden]{display:none !important;}
  body{
    background:#050817;
    overflow:hidden;
    font-family:"Fraunces",Georgia,serif;
    -webkit-font-smoothing:antialiased;
  }

  #night{position:fixed;inset:0;width:100%;height:100%;display:block;}

  .words{
    position:fixed;
    left:0;right:0;
    top:24vh;
    text-align:center;
    pointer-events:none;
    user-select:none;
  }
  .timer{
    display:flex;
    justify-content:center;
    gap:clamp(16px,5vw,44px);
    opacity:0;
    animation:rise 2.4s ease-out .4s forwards;
  }
  .timer div{display:flex;flex-direction:column;align-items:center;gap:.45em;min-width:1.4em;}
  .timer b{
    font-weight:300;
    font-style:italic;
    font-variation-settings:"SOFT" 100;
    font-size:clamp(2.8rem,10vw,6.2rem);
    line-height:1;
    font-variant-numeric:tabular-nums;
    color:#F4E9CF;
    text-shadow:0 0 28px rgba(244,214,140,.25);
  }
  .timer span{
    font-size:clamp(.62rem,1.6vw,.75rem);
    letter-spacing:.2em;
    color:rgba(244,233,207,.5);
  }

  .words .lead{
    margin:0 0 .8em;
    font-style:italic;
    font-size:clamp(1.1rem,3.4vw,1.6rem);
    letter-spacing:.06em;
    color:rgba(244,233,207,.75);
    opacity:0;
    animation:rise 2.4s ease-out .2s forwards;
  }
  .words .lead.after{margin:.7em 0 0;animation-delay:.8s;}

  .words p.miss{
    margin:1.6em 0 0;
    font-style:italic;
    font-weight:400;
    font-size:clamp(1.15rem,3.6vw,1.7rem);
    letter-spacing:.06em;
    color:#E9C46A;
    opacity:0;
    animation:rise 2.4s ease-out 1.6s forwards;
  }
  .dots i{
    font-style:inherit;
    opacity:.15;
    animation:dot 2.4s ease-in-out infinite;
  }
  .dots i:nth-child(2){animation-delay:.4s;}
  .dots i:nth-child(3){animation-delay:.8s;}

  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes dot{0%,100%{opacity:.15}40%{opacity:1}}

  @media (prefers-reduced-motion:reduce){
    .words p,.timer{animation:none;opacity:1;}
    .dots i{animation:none;opacity:1;}
  }
</style>
</head>
<body>

<canvas id="night" aria-hidden="true"></canvas>

<main class="words">
  <p class="lead">it's just</p>
  <div class="timer" id="timer" role="timer" aria-label="Time until 9 December, 4:15 am">
    <div><b id="d">00</b><span>days</span></div>
    <div><b id="h">00</b><span>hrs</span></div>
    <div><b id="m">00</b><span>min</span></div>
    <div><b id="s">00</b><span>sec</span></div>
  </div>
  <p class="lead after">more</p>
  <p class="miss">waiting, miss you<span class="dots"><i>.</i><i>.</i><i>.</i></span></p>
</main>

<script>
(function(){
  var TARGET = new Date('2026-12-09T04:15:00+05:30').getTime();
  var el = {
    d: document.getElementById('d'), h: document.getElementById('h'),
    m: document.getElementById('m'), s: document.getElementById('s')
  };
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function tick(){
    var left = Math.max(0, Math.floor((TARGET - Date.now())/1000));
    el.d.textContent = pad(Math.floor(left/86400));
    el.h.textContent = pad(Math.floor(left%86400/3600));
    el.m.textContent = pad(Math.floor(left%3600/60));
    el.s.textContent = pad(left%60);
    if(left === 0) document.getElementById('timer').hidden = true;
  }
  tick();
  setInterval(tick, 1000);
})();

(function(){
  var cv = document.getElementById('night');
  var ctx = cv.getContext('2d');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, S = 1, raf = null;
  var stars = [], layers = [], flies = [], shoot = null, nextShoot = 0;

  var FOG    = [22, 30, 64];
  var PETAL  = [222, 166, 42];
  var HEART  = [46, 26, 12];
  var LEAF   = [40, 72, 36];
  var GROUND = [12, 22, 18];

  function mix(a, b, t){
    return 'rgb(' + Math.round(a[0]+(b[0]-a[0])*t) + ',' +
                    Math.round(a[1]+(b[1]-a[1])*t) + ',' +
                    Math.round(a[2]+(b[2]-a[2])*t) + ')';
  }
  function rnd(a, b){ return a + Math.random()*(b-a); }

  function seed(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*dpr; cv.height = H*dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.max(0.55, Math.min(W, H*1.2) / 900);

    stars = [];
    var n = Math.round(W*H/2600);
    for(var i=0;i<n;i++){
      stars.push({
        x: Math.random()*W,
        y: Math.pow(Math.random(), 1.4)*H*0.78,
        r: Math.random() < 0.06 ? rnd(1.2, 1.9) : rnd(0.3, 1.1),
        a: rnd(0.25, 0.95),
        sp: rnd(0.0008, 0.003),
        ph: Math.random()*6.28
      });
    }

    layers = [];
    var L = 5;
    for(var l=0;l<L;l++){
      var d = l/(L-1);
      var r = (5 + 30*Math.pow(d, 1.6)) * S;
      var top = H*(0.66 + d*0.16);
      var flowers = [];
      var x = -r*2;
      while(x < W + r*2){
        flowers.push({
          x: x,
          y: top + rnd(-0.4, 1.4)*r*1.6,
          r: r*rnd(0.8, 1.15),
          sx: rnd(0.78, 1),
          rot: Math.random()*6.28,
          ph: Math.random()*6.28,
          amp: rnd(0.02, 0.045),
          leaf: rnd(0.35, 0.6),
          lean: rnd(-0.08, 0.08)
        });
        x += r*rnd(2.1, 3.0);
      }
      flowers.sort(function(a, b){ return a.y - b.y; });
      layers.push({
        d: d,
        top: top,
        r: r,
        flowers: flowers,
        petal: mix(FOG, PETAL, 0.22 + 0.78*d*d),
        petalBack: mix(FOG, [176, 120, 30], 0.2 + 0.7*d*d),
        heart: mix(FOG, HEART, 0.4 + 0.6*d),
        leafc: mix(FOG, LEAF, 0.25 + 0.75*d),
        ground: mix(FOG, GROUND, 0.45 + 0.55*d)
      });
    }

    flies = [];
    var fn = Math.round(Math.min(40, W/30));
    for(var f=0;f<fn;f++){
      flies.push({
        x: Math.random()*W,
        y: rnd(H*0.55, H*0.95),
        ph: Math.random()*6.28,
        sp: rnd(0.0002, 0.0005),
        rx: rnd(20, 70)*S,
        ry: rnd(10, 35)*S,
        bl: rnd(0.0008, 0.002)
      });
    }
  }

  function sky(t){
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#03050F');
    g.addColorStop(0.45, '#0A1230');
    g.addColorStop(0.72, '#1A2652');
    g.addColorStop(1, '#22305C');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var mx = W*0.8, my = H*0.15, mr = 26*S;
    var glow = ctx.createRadialGradient(mx, my, mr*0.6, mx, my, mr*9);
    glow.addColorStop(0, 'rgba(250,236,200,0.22)');
    glow.addColorStop(1, 'rgba(250,236,200,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    for(var i=0;i<stars.length;i++){
      var s = stars[i];
      var a = reduce ? s.a : s.a*(0.55 + 0.45*Math.sin(t*s.sp + s.ph));
      ctx.globalAlpha = a;
      ctx.fillStyle = '#FBF3DF';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#F6EBCF';
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, 6.2832);
    ctx.fill();
    ctx.fillStyle = 'rgba(200,186,150,0.25)';
    ctx.beginPath(); ctx.arc(mx - mr*0.3, my - mr*0.2, mr*0.22, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + mr*0.35, my + mr*0.25, mr*0.15, 0, 6.2832); ctx.fill();

    if(reduce) return;
    if(!shoot && t > nextShoot){
      shoot = { x: rnd(W*0.1, W*0.7), y: rnd(H*0.04, H*0.3), t0: t, len: rnd(90, 160)*S };
    }
    if(shoot){
      var p = (t - shoot.t0)/900;
      if(p >= 1){ shoot = null; nextShoot = t + rnd(5000, 11000); }
      else{
        var hx = shoot.x + p*W*0.25, hy = shoot.y + p*W*0.1;
        var sg = ctx.createLinearGradient(hx, hy, hx - shoot.len, hy - shoot.len*0.4);
        sg.addColorStop(0, 'rgba(255,248,226,' + (1-p).toFixed(3) + ')');
        sg.addColorStop(1, 'rgba(255,248,226,0)');
        ctx.strokeStyle = sg;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(hx - shoot.len, hy - shoot.len*0.4);
        ctx.stroke();
      }
    }
  }

  function ground(L){
    ctx.fillStyle = L.ground;
    ctx.beginPath();
    var base = L.top + L.r*2.2;
    ctx.moveTo(0, H);
    for(var x=0;x<=W+20;x+=20){
      ctx.lineTo(x, base + Math.sin(x*0.004 + L.d*3)*L.r*0.8);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }

  function leaf(x, y, len, ang, color){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(len*0.5, -len*0.35, len, 0);
    ctx.quadraticCurveTo(len*0.5, len*0.35, 0, 0);
    ctx.fill();
    ctx.restore();
  }

  function flower(L, f, t){
    var wind = reduce ? 0 :
      Math.sin(t*0.0007 + f.ph)*f.amp +
      Math.sin(t*0.00035 - f.x*0.004)*0.04;
    var sway = wind + f.lean;
    var stemH = H + 10 - f.y;
    var hx = f.x + sway*stemH*0.6;
    var hy = f.y;
    var r = f.r;

    var cx = f.x, cy = (H + hy)/2;
    ctx.strokeStyle = L.leafc;
    ctx.lineWidth = Math.max(1, r*0.14);
    ctx.beginPath();
    ctx.moveTo(f.x, H + 10);
    ctx.quadraticCurveTo(cx, cy, hx, hy);
    ctx.stroke();

    if(r > 7){
      var lt = f.leaf, it = 1 - lt;
      var lx = it*it*f.x + 2*it*lt*cx + lt*lt*hx;
      var ly = it*it*(H+10) + 2*it*lt*cy + lt*lt*hy;
      leaf(lx, ly, r*1.1, -0.5 + sway, L.leafc);
      leaf(lx, ly + r*0.6, r*0.95, Math.PI + 0.5 + sway, L.leafc);
    }

    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(sway*1.2);
    ctx.scale(f.sx, 1);

    var n = r > 10 ? 18 : 12;
    var spin = f.rot + (reduce ? 0 : Math.sin(t*0.0003 + f.ph)*0.05);
    ctx.fillStyle = L.petalBack;
    for(var k=0;k<n;k++){
      var a = spin + (k + 0.5)/n*6.2832;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a)*r*0.82, Math.sin(a)*r*0.82, r*0.5, r*0.15, a, 0, 6.2832);
      ctx.fill();
    }
    ctx.fillStyle = L.petal;
    for(var j=0;j<n;j++){
      var b = spin + j/n*6.2832;
      ctx.beginPath();
      ctx.ellipse(Math.cos(b)*r*0.72, Math.sin(b)*r*0.72, r*0.46, r*0.15, b, 0, 6.2832);
      ctx.fill();
    }
    ctx.fillStyle = L.heart;
    ctx.beginPath();
    ctx.arc(0, 0, r*0.5, 0, 6.2832);
    ctx.fill();
    if(r > 14){
      ctx.fillStyle = 'rgba(120,80,30,0.35)';
      for(var q=0;q<14;q++){
        var qa = q*2.4, qr = Math.sqrt(q/14)*r*0.4;
        ctx.beginPath();
        ctx.arc(Math.cos(qa)*qr, Math.sin(qa)*qr, r*0.04, 0, 6.2832);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function fireflies(t){
    for(var i=0;i<flies.length;i++){
      var f = flies[i];
      var x = f.x + Math.sin(t*f.sp + f.ph)*f.rx;
      var y = f.y + Math.cos(t*f.sp*1.3 + f.ph)*f.ry;
      var a = reduce ? 0.6 : Math.max(0, Math.sin(t*f.bl + f.ph*3));
      if(a < 0.02) continue;
      var rad = 7*S;
      var g = ctx.createRadialGradient(x, y, 0, x, y, rad);
      g.addColorStop(0, 'rgba(240,236,140,' + (a*0.9).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(240,236,140,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - rad, y - rad, rad*2, rad*2);
    }
  }

  function draw(t){
    sky(t);
    for(var l=0;l<layers.length;l++){
      var L = layers[l];
      ground(L);
      for(var i=0;i<L.flowers.length;i++) flower(L, L.flowers[i], t);
      if(l === layers.length - 2) fireflies(t);
    }
    if(!reduce) raf = requestAnimationFrame(draw);
  }

  seed();
  if(reduce) draw(0);
  else raf = requestAnimationFrame(draw);

  var rz;
  window.addEventListener('resize', function(){
    clearTimeout(rz);
    rz = setTimeout(function(){ seed(); if(reduce) draw(0); }, 150);
  });
})();
</script>
</body>
</html>
